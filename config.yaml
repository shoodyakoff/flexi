output_dir: ./output
video:
  resolution: "1080x1920"
  fps: 30
  codec: "libx264"
  crf: 20  # финальный проход
  crf_intermediate: 18  # промежуточные (нормализация хука/cta/broll) — визуально lossless
audio:
  sample_rate: 48000
  voiceover_gain_db: 3
  broll_audio_gain_db: -100  # keep b-roll nat sound muted for now
  # Громкость фоновой музыки в dB (децибелах).
  # 0 = исходная громкость, отрицательные = тише.
  # Ориентир: -6 dB ≈ вдвое тише по ощущению.
  # -20 = тихий фон, -26 = ещё тише (почти неслышно), -14 = заметнее.
  music_gain_db: -26
  music_fade_in_sec: 1.0
  music_fade_out_sec: 1.5
  music_start_mode: "full_reel"
  # Auto-ducking: музыка автоматически приглушается под голос и
  # возвращается в паузах (ffmpeg sidechaincompress). Снимает «кашу»,
  # когда музыка и речь спорят за громкость.
  music_ducking: true
  music_duck_threshold: 0.03   # с какого уровня речи начинать жать (0..1)
  music_duck_ratio: 8.0        # насколько сильно прижимать музыку
  music_duck_attack_ms: 20     # как быстро музыка уходит вниз под голос
  music_duck_release_ms: 300   # как быстро возвращается в паузе
  voiceover_tail_silence_sec: 0.1
  voiceover_lead_silence_sec: 0.2
  # Целевая громкость речи (LUFS, стандарт YouTube/подкастов: -16).
  # Применяется к hook, cta и закадровому голосу — чтобы все сегменты
  # звучали одинаково громко.
  loudnorm_target_lufs: -16
  loudnorm_true_peak: -1.5
  loudnorm_lra: 11

fonts:
  directory: "./assets/fonts"
  base_family: "Onest"
  accent_family: "Bebas Neue Cyrillic"
  provocative_accent_family: "Bebas Neue Cyrillic"

edit_profile:
  subtitle_style: "editorial_pop"
  rhythm_profile: "provocative_soft"
  look_profile: "punchy"
  dark_look_profile: "punchy_bright"
  dark_luma_threshold: 90
  music_file: "assets/music/provocative.mp3"

rhythm_profiles:
  provocative_soft:
    pattern: ["support", "detail", "anchor", "support", "detail", "anchor"]
    phrase_gap_min_sec: 0.20
    snap_tolerance_sec: 0.30
    contrast_window_sec: 7.0
    roles:
      support:
        min_duration_sec: 1.2
        preferred_duration_min_sec: 1.4
        preferred_duration_max_sec: 1.8
        max_duration_sec: 2.1
        shot_scales: ["medium", "wide"]
        sequence_roles: ["action", "establish"]
      detail:
        min_duration_sec: 0.9
        preferred_duration_min_sec: 1.0
        preferred_duration_max_sec: 1.2
        max_duration_sec: 1.4
        shot_scales: ["detail", "close", "medium"]
        sequence_roles: ["detail", "action"]
      anchor:
        min_duration_sec: 2.2
        preferred_duration_min_sec: 2.6
        preferred_duration_max_sec: 3.2
        max_duration_sec: 3.6
        shot_scales: ["medium", "wide"]
        sequence_roles: ["action", "establish"]

product_insert:
  min_duration_sec: 2.0
  preferred_duration_sec: 3.0
  preferred_duration_min_sec: 2.5
  preferred_duration_max_sec: 4.0
  max_duration_sec: 4.0
  marker_pause_sec: 0.8
  fallback_pause_after_ratio: 0.55
  fallback_pause_min_gap_sec: 0.25
  timeline_fallback_ratio: 0.65

look_profiles:
  neutral:
    brightness: 0.0
    contrast: 1.0
    saturation: 1.0
    gamma: 1.0
    sharpness: 0.0
  warm:
    brightness: -0.015
    contrast: 1.05
    saturation: 1.08
    gamma: 0.98
    sharpness: 0.35
  punchy:
    brightness: 0.005
    contrast: 1.06
    saturation: 1.08
    gamma: 1.01
    sharpness: 0.35
  punchy_bright:
    brightness: 0.07
    contrast: 1.04
    saturation: 1.08
    gamma: 1.05
    sharpness: 0.35
    # Optional film/brand look: add a .cube 3D LUT applied after the eq grade.
    # lut_file: "assets/luts/teal_orange.cube"

# B-roll transitions between clips. Disabled by default (hard cuts).
# Enable to get crossfades/wipes/slides; the timeline length is preserved
# (each outgoing clip is extended by duration_sec so it stays in voiceover sync).
# kind: cut | fade/dissolve | dipblack | dipwhite |
#       wipeleft | wiperight | wipeup | wipedown |
#       slideleft | slideright | slideup | slidedown
transition:
  enabled: true
  kind: "dissolve"
  duration_sec: 0.18
  min_clip_duration_sec: 0.9
  skip_product_insert: true

subtitle_safe_box:
  play_res_x: 1080
  play_res_y: 1920
  center_x: 540
  # Conservative shared safe box for current Reels/Shorts UI overlays.
  top_padding_px: 260
  bottom_padding_px: 460
  # No side guard — long words are allowed to use the full frame width.
  side_padding_px: 0
  # Где стоят бегущие субтитры по вертикали: "bottom" — нижняя треть (дефолт,
  # привычный вид рилса), "top" — вверху. Верх нужен только если низ кадра занят
  # b-roll-вставкой (иначе субтитры на неё налезут). Хук/CTA это не меняет.
  body_caption_position: "bottom"

# Варианты титров для комбинаторных роликов «Советы» (pipelines/sovety_reel.py).
# Блоки рендерятся ОДИН раз с базовым стилем (editorial_pop, жёлтый акцент); при
# сборке конкретного ролика сборщик переписывает акцентный цвет, вертикаль и
# размер прямо в ASS — перерендер блоков не нужен. Так один и тот же блок в
# разных роликах выглядит по-разному, что и требуется против дедупликации.
# Цвет в ASS пишется как &HAABBGGRR (байты HEX-цвета задом наперёд).
sovety_captions:
  base_accent: "&H0000F5FF"      # что заменяем — акцент из subtitle_styles.editorial_pop
  outline_color: "&H00000000"    # чёрная обводка у всех вариантов
  accents:
    yellow: "&H0000F5FF"         # #FFF500 — текущий, дефолт
    white: "&H00FFFFFF"          # #FFFFFF — акцентное слово отличается кеглем
    orange: "&H001574F9"         # #f97415
  # Сдвиг титров по вертикали, px (минус — выше). Держать в пределах ±80: ниже
  # начинается зона интерфейса рилса, выше титры лезут на лицо.
  positions:
    низ: 0
    выше: -60
  # Множитель кегля. Крупнее 1.08 длинные слова начинают переноситься иначе.
  size_scales: [1.0, 1.05, 0.95]

# Ускорение готового ролика «Советы» (pipelines/sovety_reel.py). Каждый ролик
# получает свой множитель из этого коридора — псевдослучайно, но детерминированно
# от номера ролика: пересборка того же номера даёт ту же скорость. Ускоряется уже
# склеенный ролик целиком (setpts + atempo, высота голоса не меняется): речь
# бодрее, а ролики с общими блоками расходятся по длительности и аудиоследу.
sovety_speed:
  min: 1.0
  max: 1.2

# То же ускорение, но для потоков «хук + демо» (Умный отклик, Анализ резюме) —
# и только на ДЕМО, не на всём ролике. Демо повторяется 15–16 раз за месяц и
# именно оно тянет похожесть; хук в каждом дне свой, его трогать незачем.
# Множитель берётся из коридора по тому же золотому сечению, но от номера
# ИСПОЛЬЗОВАНИЯ этого демо — соседние показы никогда не совпадают по темпу, а
# длительность и аудиослед у общего куска расходятся на десятки процентов.
demo_speed:
  min: 1.0
  max: 1.2

# Анимированный «заголовок челленджа»: пользователь экспортирует короткий клип с
# текстом на ЧЁРНОМ фоне (1080×1920, текст уже сверстан вверху-слева), кладёт его
# в assets/titles/, и пайплайн накладывает его в начало ролика на его же
# длительность. Чёрный фон выбивается (colorkey), в конце — плавное затухание.
# Включается у talking-head флагом --title <файл>.
title_overlay:
  colorkey_color: "0x000000"   # фон клипа-заголовка, который делаем прозрачным
  colorkey_similarity: 0.10    # допуск к «почти чёрному» (антиалиас по краям букв)
  colorkey_blend: 0.08         # мягкость края выбивания
  fade_out_sec: 0.36           # плавное исчезновение заголовка в конце
  # Заголовок челленджа по умолчанию. Для роликов челленджа (которые идут в
  # «Рилс для публикции/challenge/dNN») он накладывается автоматически — флаг
  # --auto-title. Явный --title всегда главнее. Поменялся заголовок челленджа —
  # положи новый клип в assets/titles/ и обнови этот путь (одна строка).
  default_title: "assets/titles/title_001.mp4"

hook_montage:
  enabled: true
  target_min_sec: 3.0
  target_max_sec: 8.9
  silence_gap_cut_sec: 0.75
  speech_lead_padding_sec: 0.12
  speech_padding_sec: 0.5
  tail_padding_sec: 0.5
  typography:
    style: "white_soft_shadow"
    base_y_px: 255
    accent_y_px: 255
    accent_size: 112
    accent_keywords: ["показываю"]
  motion:
    enabled: true
    opening_punch_in: false
    opening_duration_sec: 0.55
    opening_zoom_delta: 0.025
    keyword_punch: false
    keyword_punch_duration_sec: 0.28
    keyword_zoom_delta: 0.035
    riser_zoom: true
    riser_zoom_delta: 0.28
    riser_zoom_out_duration_sec: 9.0
    riser_zoom_in_duration_sec: 0.40
  transition:
    enabled: true
    duration_sec: 0.32
    fade_in_sec: 0.06
    color: "0xffb14a"
    opacity: 0.88
  sfx:
    riser: "assets/sounds/riser.mp3"
    riser_peak_offset_sec: 1.75
    # Source riser is ~-17 dB mean / -0.2 dB peak. -8.5 dB is 0.75x
    # amplitude versus the previous -6 dB hook preset.
    riser_gain_db: -8.5
    swoosh: "assets/sounds/swoosh.mp3"
    swoosh_gain_db: -8.0
    max_sfx_events: 2
    min_swoosh_gap_from_peak_sec: 0.50
  overlays:
    # Auto-pick: scoring uses anchors from assets/hook_overlays/_meta.json
    # against hook + CTA voiceover. Rendering params apply to whichever icon wins.
    max_events: 1
    min_score: 1.0
    cta_weight: 0.5
    accent_bonus: 0.5
    placement: "bottom_right"
    width_px: 300
    opacity: 1.35
    enter_sec: 0.14
    exit_sec: 0.12
    display_duration_sec: 2.00

render_guardrails:
  fail_on_long_hook: true
  fail_on_missing_hook_accent: true
  fail_on_long_cta: true
  cta_target_max_sec: 6.0
  cta_soft_tail_sec: 0.35

broll_rotation:
  recent_history_size: 8
  recent_start_window: 4
  recent_start_penalty: 18.0
  recent_anywhere_penalty: 6.0

# Meme machine route (#7): caption look for face+punch variants.
# font_regular/font_bold are one Gilroy family at two weights (Bold↔Heavy) —
# the weight contrast drives the dedup bold_cycle. Paths resolve from repo root.
meme:
  font_regular: assets/fonts/GilroyBold.ttf
  font_bold: assets/fonts/GilroyHeavy.ttf
  palette: ["white", "#FFD400", "#00E0FF"]   # 3 цвета для дедупа; подбирать под кадр
  bold_cycle: [true, false, true]
  top_box: [40, 130, 1000, 380]
  bottom_box: [40, 1410, 1000, 380]
  font_size: 74
  max_chars_per_line: 20

annotation:
  ingest_dir: "assets/broll_ingest"
  normalize_new_clips: true
  pilot_target_count: 20
  default_weight: 1.0
  required_fields:
    - "shot_scale"
    - "subject_kind"
    - "energy"
    - "scene_group"
  motion_presets_by_shot_scale:
    wide: ["zoom_in_soft", "zoom_out_soft", "drift_left", "drift_right", "push_up", "push_down"]
    medium: ["zoom_in_soft", "zoom_out_soft", "drift_left", "drift_right"]
    close: ["static"]
    detail: ["static"]

tts:
  model_id: "eleven_multilingual_v2"
  output_format: "mp3_44100_192"
  language_code: "ru"
  apply_text_normalization: "auto"
  generation_mode: "direct"
  markup_dialect: "v2"
  speed: 1.15
  # Optional: bring your own ElevenLabs pronunciation dictionary. Create one in
  # your ElevenLabs account, then add its locator(s) here. Empty by default.
  pronunciation_dictionary_locators: []

whisper:
  # Модель для forced alignment voiceover'а (известный текст → тайминги слов).
  # large-v3 — точнее всего, лучше держит границы слов и не "съедает" символы
  # На CPU долго (~1-3 мин на минуту аудио),
  # но кешируется. Альтернативы: medium (быстрее, чуть хуже), base (быстро, ошибки).
  align_model: large-v3
  transcribe_model: large-v3

# Автоисправление слов в субтитрах. Whisper стабильно путает доменные термины —
# здесь они чинятся ДО прожига субтитров, по всему слову целиком и без учёта
# регистра (подстроки не трогаются: «код»→«Клод» не заденет «кодер»).
# Ключ — как Whisper услышал, значение — как должно быть на экране.
# Добавляй сюда новые повторяющиеся ошибки — больше не придётся править руками.
subtitle_corrections:
  цепровод: "Сопровод"      # имя продукта
  сопровода: "Сопровода"
  рилз: "рилс"              # reels
  релс: "рилс"              # reels — мисхёр Whisper («е» вместо «и»)
  релсы: "рилсы"
  релсов: "рилсов"
  код: "Клод"               # Claude (но НЕ «кодер» — он не тронется)
  коде: "Клоде"
  клод: "Клод"
  сас: "SaaS"
  саас: "SaaS"
  кубков: "хуков"            # hooks (хуков) — Whisper мисхёр; в нише «кубков» не встречается
  отрек: "отклик"            # «каждый отклик» — Whisper слышит «отрек»
  нервонкой: "нейронкой"     # «нейронка» (нейросеть) — Whisper мисхёр
  атс: "ATS"                 # applicant tracking system — бренд-термин, латиницей
  мсп: "MCP"                 # Model Context Protocol — Whisper слышит «МСП» кириллицей
  chargegpt: "ChatGPT"       # Whisper мисхёр названия
  charge: "ChatGPT"          # «Charge 5» = «ChatGPT», отдельного «charge» в нише нет
  прошивки: "прожарки"       # «прожарка резюме» — Whisper слышит «прошивка»
  пейплайн: "пайплайн"       # pipeline — Whisper слышит «пейплайн»
  пейплайна: "пайплайна"
  дедубликация: "дедупликация"   # dedup — Whisper вставляет «б» вместо «п»
  дедубликации: "дедупликации"
  дедубликацию: "дедупликацию"
  нахваты: "на охваты"       # «работать на охваты» — Whisper слипает в одно слово
  анбординг: "онбординг"     # onboarding — Whisper пишет «а» вместо «о»
  вайп: "вайб"               # вайб-кодинг — Whisper слышит «п» вместо «б»
  вейп: "вайб"               # тот же мисхёр через «е»
  "за***ть": "заипать"       # Whisper цензурит мат звёздочками → восстанавливаем форму
  заебался: "заипался"       # тот же смягчённый мат в прошедшем времени
  заебалась: "заипалась"
  заебала: "заипала"
  заебало: "заипало"
  заебали: "заипали"
  заебал: "заипал"
  нихуя: "ниуя"              # пользователь хочет смягчённое написание мата
  хуям: "уям"                # «к хуям» — та же маска: выпадает «х» (звук как есть)
  охуевал: "оуевал"          # та же маска: выпадает «х»
  пиздой: "пездой"           # смягчённое написание («и»→«е»)
  бля: "пля"                 # маска «б»→«п», как в заеб→заип

subtitle_styles:
  bold_highlight:
    font: "Onest"
    # Single unified subtitle look, rendered word-by-word at the top
    # of the frame.
    size: 85
    primary_color: "&H001574F9"
    outline_color: "&H66000000"
    outline: 3
    shadow: 1
    margin_v: 220
    uppercase: true
    strip_punctuation: true
    # One meaningful word per event. Short helper tokens and digits may attach.
    max_words_per_chunk: 1
    max_chunk_duration_sec: 1.15
    max_chunk_gap_sec: 0.18
    min_display_duration_sec: 0.32
    min_event_duration_warning_sec: 0.12
    end_hold_sec: 0.08
    fade_in_ms: 20
    fade_out_ms: 20
    attach_short_tokens: true
    attach_numbers: true
    forbid_two_content_words: true
    # Long words can wrap to a second line without a hyphen, preserving font size
    # when both lines fit inside the safe area.
    split_long_words: true
    max_lines: 2

  white_soft_shadow:
