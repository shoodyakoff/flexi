# ============================================================================
# EXAMPLE EPISODE — copy this file to <yourday>.conf and edit decisions only.
# All machinery lives in build_3strip.zsh; this file is just the edit.
#
# Rules (see RULES.md): 3-strip cascade, NO repeats (each clip once),
# faces RARE, bed bookend. Columns are index-aligned across MID/TOP/BOT
# (same duration per column). Entry = "IMGNUM IN DUR".
#
# Run:  zsh build_3strip.zsh episodes/example.conf
# ============================================================================
NAME="example"
RAW="raw/example"                 # folder with your IMG_*.MOV clips
OUT="output/example"              # render + QA artifacts land here
WORK="$OUT/work_$NAME"            # tile cache (fast rebuilds); safe to delete
MAX_DUR=30

# Clips that are upside-down as RAW (iPhone rotation tags LIE — verify by eye).
# Space-separated IMG numbers. Leave empty if all clips are already upright.
NEED180=""

# Music: any audio file you have the rights to. Drop it in assets/music/.
MUSIC="assets/music/default.mp3"
MUSIC_START=0
MUSIC_VOL=0.7

# Cascade offsets: middle band leads at t=0, top enters +0.5s, bottom +1.0s.
LEAD_top=0.5
LEAD_bot=1.0

# ---------------------------------------------------------------------------
# Per-band timelines. Each entry is "IMGNUM IN DUR" (clip number, in-point sec,
# duration sec). The three arrays are index-aligned: column i has the SAME DUR
# in MID/TOP/BOT so the cascade staggers transitions without drifting apart.
# Author chronologically. Each column = 3 DIFFERENT categories; never 3
# lookalikes; max 1 screen/laptop per column; demo->usage adjacent in one band.
# Replace these placeholder numbers with your own clips.
# ---------------------------------------------------------------------------
#        col:  1      2      3      4
MID=(
  "1001 0.0 1.5" "1004 2.0 1.4" "1007 1.0 1.3" "1010 0.5 1.6"
)
TOP=(
  "1002 0.5 1.5" "1005 1.0 1.4" "1008 3.0 1.3" "1011 0.8 1.6"
)
BOT=(
  "1003 1.0 1.5" "1006 0.5 1.4" "1009 2.0 1.3" "1012 1.2 1.6"
)

# Bed cascade-out outro (all appear together -> top off -> bot off -> center
# holds to the end). Set ENDLEN=0 to disable the outro entirely.
ENDLEN=0
OUTRO_TOP="";  OUTRO_TOP_VIS=1.0
OUTRO_BOT="";  OUTRO_BOT_VIS=1.8
OUTRO_CTR=""
